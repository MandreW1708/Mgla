# Отдельный vhost ТОЛЬКО для mgla.home.mooo.com.
# Не трогает sites-enabled/mglahub (apiws, mgla-stats, tproxy, admin).
#
# Установка:
#   cp nginx-mgla-home.conf /etc/nginx/sites-available/mgla-home
#   ln -sf /etc/nginx/sites-available/mgla-home /etc/nginx/sites-enabled/mgla-home
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mgla.home.mooo.com

server {
    listen 80;
    listen [::]:80;
    server_name mgla.home.mooo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mgla.home.mooo.com;

    # После certbot пути подставятся автоматически; до сертификата
    # можно временно закомментировать ssl_* и слушать только :80.
    ssl_certificate     /etc/letsencrypt/live/mgla.home.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mgla.home.mooo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
