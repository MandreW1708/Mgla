# Nginx-сайт для Mgla Hub: https://mglahub.mooo.com
#
# Панель + /mgla-stats/ + /mgla-config/ + /mgla-updates/ + /mgla-auth/ (:8767)
# Ultra WS /apiws (:8766) + Ultra AI /mgla-ai/ (:8768 ai_proxy) —
# клиент с включённым Ultra-обходом ходит сюда напрямую (не через mglabot).
#
# Установка:
#   1) Скопируйте этот файл в /etc/nginx/sites-available/mglahub
#   2) ln -s /etc/nginx/sites-available/mglahub /etc/nginx/sites-enabled/
#   3) Получите сертификат: certbot --nginx -d mglahub.mooo.com
#   4) nginx -t && systemctl reload nginx
#
# В http { ... } (один раз на весь nginx, например в nginx.conf) добавьте:
#   limit_req_zone $binary_remote_addr zone=mgla_stats:10m rate=6r/m;
#   limit_req_zone $binary_remote_addr zone=mgla_hub:10m rate=20r/m;
#   limit_req_zone $binary_remote_addr zone=mgla_ai:10m rate=4r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mglahub.mooo.com;

    # После certbot здесь появится редирект на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Без http2: клиентский WS-обход шлёт сырой HTTP/1.1 Upgrade по TLS.
    # http2 в listen провоцирует ALPN h2 и ломает апгрейд у части стеков.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mglahub.mooo.com;

    # Стандартные пути Let's Encrypt (certbot --nginx -d mglahub.mooo.com).
    ssl_certificate     /etc/letsencrypt/live/mglahub.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mglahub.mooo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Панель: Basic Auth и на nginx, и на бэкенде (двойная защита).
    # Отдельный realm для /admin* — браузер снова спросит пароль, даже если
    # уже залогинены на статистике /. Клиентские API (/mgla-*) без browser-auth.
    # htpasswd: /etc/nginx/htpasswd-mglahub (из MGLA_STATS_REPORT_USER/PASSWORD).
    # /admin/updates принимает APK (до ~200 МБ).
    location ^~ /admin {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 210m;
        auth_basic "Mgla Hub Admin";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location ^~ /mgla-admin {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 210m;
        auth_basic "Mgla Hub Admin";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location ^~ /control {
        limit_req zone=mgla_hub burst=20 nodelay;
        auth_basic "Mgla Hub Admin";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location / {
        limit_req zone=mgla_hub burst=40 nodelay;
        client_max_body_size 210m;
        auth_basic "Mgla Hub";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    # Клиентский check/download обновлений (токен X-Mgla-Token).
    location /mgla-updates/ {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
    }

    # Приём статистики от клиентов (токен в заголовке X-Mgla-Token).
    location /mgla-stats/ {
        limit_req zone=mgla_stats burst=10 nodelay;
        client_max_body_size 256k;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header Authorization $http_authorization;

        # Анонимно: IP не пишем.
        access_log off;
    }

    # Entitlements: bypass nodes (fin/mglabot) hit this on every WS open.
    # Must NOT share the tight mgla_hub burst used by /mgla-auth (503 → Ultra down).
    location = /mgla-config/v1/entitlements {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        proxy_set_header X-Mgla-Sync-Token $http_x_mgla_sync_token;
        proxy_set_header X-Mgla-Entitlements-Token $http_x_mgla_entitlements_token;
        access_log off;
    }

    # Feature flags / remote config (клиентский JWT или sync-токен бота/релея).
    location /mgla-config/ {
        limit_req zone=mgla_hub burst=40 nodelay;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        proxy_set_header X-Mgla-Sync-Token $http_x_mgla_sync_token;
        proxy_set_header X-Mgla-Entitlements-Token $http_x_mgla_entitlements_token;
        access_log off;
    }

    # Gemini: расшифровка голосовых (большое тело) — ai_proxy :8768.
    location = /mgla-ai/v1/gemini/transcribe {
        limit_req zone=mgla_ai burst=8 nodelay;
        client_max_body_size 25m;

        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        proxy_set_header X-Mgla-Sync-Token $http_x_mgla_sync_token;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        access_log off;
    }

    # Скачивание APK (ai_proxy → /mgla-updates/v1/apk) — длинный таймаут, как на mglabot.
    location = /mgla-ai/v1/update-apk {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        proxy_set_header X-Mgla-Tg-Id $http_x_mgla_tg_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
    }

    # HF / local models — long stream (must be before /mgla-ai/ catch-all).
    location = /mgla-ai/v1/fetch {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        access_log off;
    }

    # Ultra AI (тот же ai_proxy.py, что на mglabot) — OpenRouter/Gemini/models + update-check.
    location /mgla-ai/ {
        limit_req zone=mgla_ai burst=30 nodelay;
        client_max_body_size 2m;

        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        proxy_set_header X-Mgla-Sync-Token $http_x_mgla_sync_token;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        access_log off;
    }

    # Ultra-only WS-релей (relay.py :8766, MGLA_WS_ULTRA_ONLY=1).
    # Не пересекается со stats/admin/updates/site (8767/8770).
    location /apiws {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Plan $http_x_mgla_plan;
        proxy_set_header X-Mgla-Priority $http_x_mgla_priority;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;
        # Hub entitlements / Ultra-only gate — must reach relay.py
        proxy_set_header X-Mgla-Tg-Id $http_x_mgla_tg_id;
        proxy_set_header X-Mgla-Tg-Ids $http_x_mgla_tg_ids;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        access_log off;
    }
}

