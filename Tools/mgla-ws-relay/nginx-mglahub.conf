# Nginx-сайт для Mgla Hub: https://mglahub.mooo.com
#
# Панель статистики + /admin (flags/models) + /mgla-stats/ + /mgla-config/.
# Рабочий ИИ и WS-обход — на mglabot; location /mgla-ai/ и /apiws здесь
# опциональны (legacy), клиент туда больше не ходит.
#
# Установка:
#   1) Скопируйте этот файл в /etc/nginx/sites-available/mglahub
#   2) ln -s /etc/nginx/sites-available/mglahub /etc/nginx/sites-enabled/
#   3) Получите сертификат: certbot --nginx -d mglahub.mooo.com
#   4) nginx -t && systemctl reload nginx
#
# В http { ... } (один раз на весь nginx, например в nginx.conf) добавьте:
#   limit_req_zone $binary_remote_addr zone=mgla_stats:10m rate=6r/m;
#   limit_req_zone $binary_remote_addr zone=mgla_hub:10m rate=20r/m;
#   limit_req_zone $binary_remote_addr zone=mgla_ai:10m rate=4r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mglahub.mooo.com;

    # После certbot здесь появится редирект на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Без http2: клиентский WS-обход шлёт сырой HTTP/1.1 Upgrade по TLS.
    # http2 в listen провоцирует ALPN h2 и ломает апгрейд у части стеков.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mglahub.mooo.com;

    # Стандартные пути Let's Encrypt (certbot --nginx -d mglahub.mooo.com).
    ssl_certificate     /etc/letsencrypt/live/mglahub.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mglahub.mooo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Панель: Basic Auth и на nginx, и на бэкенде (двойная защита).
    # Отдельный realm для /admin* — браузер снова спросит пароль, даже если
    # уже залогинены на статистике /. Клиентские API (/mgla-*) без browser-auth.
    # htpasswd: /etc/nginx/htpasswd-mglahub (из MGLA_STATS_REPORT_USER/PASSWORD).
    # /admin/updates принимает APK (до ~200 МБ).
    location ^~ /admin {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 210m;
        auth_basic "Mgla Hub Admin";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location ^~ /mgla-admin {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 210m;
        auth_basic "Mgla Hub Admin";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location ^~ /control {
        limit_req zone=mgla_hub burst=20 nodelay;
        auth_basic "Mgla Hub Admin";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location / {
        limit_req zone=mgla_hub burst=40 nodelay;
        client_max_body_size 210m;
        auth_basic "Mgla Hub";
        auth_basic_user_file /etc/nginx/htpasswd-mglahub;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    # Клиентский check/download обновлений (токен X-Mgla-Token).
    location /mgla-updates/ {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        access_log off;
    }

    # Приём статистики от клиентов (токен в заголовке X-Mgla-Token).
    location /mgla-stats/ {
        limit_req zone=mgla_stats burst=10 nodelay;
        client_max_body_size 256k;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header Authorization $http_authorization;

        # Анонимно: IP не пишем.
        access_log off;
    }

    # Feature flags / remote config (токен клиента; tg_id только здесь, не в stats).
    location /mgla-config/ {
        limit_req zone=mgla_hub burst=20 nodelay;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        access_log off;
    }

    # Gemini: расшифровка голосовых (большое тело).
    location = /mgla-ai/v1/gemini/transcribe {
        limit_req zone=mgla_ai burst=3 nodelay;
        client_max_body_size 25m;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_read_timeout 180s;
        access_log off;
    }

    # ИИ-прокси (OpenRouter на сервере; Gemini — ключ пользователя в теле запроса).
    location /mgla-ai/ {
        limit_req zone=mgla_ai burst=5 nodelay;
        client_max_body_size 32k;

        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_read_timeout 90s;
        access_log off;
    }

    # Ultra-only WS-релей (relay.py :8766, MGLA_WS_ULTRA_ONLY=1).
    # Не пересекается со stats/admin/updates/site (8767/8770).
    location /apiws {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Mgla-Token $http_x_mgla_token;
        proxy_set_header X-Mgla-Plan $http_x_mgla_plan;
        proxy_set_header X-Mgla-Priority $http_x_mgla_priority;
        proxy_set_header X-Mgla-Client $http_x_mgla_client;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        access_log off;
    }
}

