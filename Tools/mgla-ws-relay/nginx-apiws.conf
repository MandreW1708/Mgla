# Вставьте внутрь server { ... } для mglabot.mooo.com (HTTPS),
# рядом с location вашего mini app. Не затирайте существующие location.

location /apiws {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Mgla-Token $http_x_mgla_token;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Gemini расшифровка (большое тело) — отдельный limit.
location = /mgla-ai/v1/gemini/transcribe {
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Mgla-Token $http_x_mgla_token;
    proxy_set_header X-Mgla-Sync-Token $http_x_mgla_sync_token;
    proxy_read_timeout 180s;
    access_log off;
}

# ИИ-прокси (OpenRouter + Gemini) на том же хосте, что WS-обход.
# Admin models push с хаба: POST /mgla-ai/v1/admin/models + X-Mgla-Sync-Token.
location /mgla-ai/ {
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Mgla-Token $http_x_mgla_token;
    proxy_set_header X-Mgla-Sync-Token $http_x_mgla_sync_token;
    proxy_read_timeout 90s;
    access_log off;
}
