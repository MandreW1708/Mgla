# 1) Вне server { ... } (в http-контексте, например в начале файла сайта):
#
# limit_req_zone $binary_remote_addr zone=mgla_stats:10m rate=6r/m;
#
# 2) Внутрь server { ... } для mglabot.mooo.com (HTTPS), рядом с location /apiws:

location /mgla-stats/ {
    limit_req zone=mgla_stats burst=10 nodelay;
    client_max_body_size 256k;

    proxy_pass http://127.0.0.1:8767;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Mgla-Token $http_x_mgla_token;

    # Статистика анонимная: IP клиента не передаётся бэкенду и не пишется в access-лог.
    access_log off;
}
