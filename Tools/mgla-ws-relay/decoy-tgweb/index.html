<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Status · Edge</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f8fa; --fg:#1f2328; --muted:#656d76; --card:#fff; --line:#d0d7de; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --card:#161b22; --line:#30363d; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--fg); }
    header { border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; }
    header strong { font-size:14px; }
    header span { color:var(--muted); font-size:12px; }
    main { max-width:720px; margin:32px auto; padding:0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; }
    h1 { margin:0 0 8px; font-size:18px; font-weight:600; }
    p { margin:0 0 12px; color:var(--muted); }
    .ok { display:inline-flex; align-items:center; gap:6px; color:#1a7f37; font-weight:600; font-size:13px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#1a7f37; }
    dl { display:grid; grid-template-columns:140px 1fr; gap:8px 16px; margin:16px 0 0; }
    dt { color:var(--muted); } dd { margin:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
    footer { max-width:720px; margin:24px auto; padding:0 20px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <strong>edge-status</strong>
    <span>runtime health</span>
  </header>
  <main>
    <div class="card">
      <div class="ok"><span class="dot"></span> All systems operational</div>
      <h1>Application edge</h1>
      <p>This host terminates TLS for application realtime channels. No interactive console is exposed on this path.</p>
      <dl>
        <dt>region</dt><dd>auto</dd>
        <dt>protocol</dt><dd>https / websocket</dd>
        <dt>build</dt><dd>stable</dd>
      </dl>
    </div>
  </main>
  <footer>© edge runtime · do not crawl</footer>
</body>
</html>
